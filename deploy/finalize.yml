- name: Finalize validated LiteLLM cutover and uninstall codex-gateway
  hosts: grace
  gather_facts: true
  tasks:
    - name: Require completed desktop validation
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == 'grace'
          - ansible_facts.user_id == 'agent'
          - litellm_desktop_validated | default(false) | bool
        fail_msg: Complete desktop history/tool checks before uninstalling the gateway.
    - name: Verify owner replaced the app server
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ litellm_root }}/scripts/cutover.py", check-restart]
      changed_when: false
      check_mode: false
    - name: Verify LiteLLM before removing the gateway
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ litellm_root }}/scripts/verify.py", --model, "{{ litellm_model }}"]
      changed_when: false
      when: not ansible_check_mode
    - name: Stop and disable the old gateway
      ansible.builtin.systemd_service:
        name: codex-gateway.service
        state: stopped
        enabled: false
      become: true
    - name: Remove only gateway-owned installation paths
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - /etc/systemd/system/codex-gateway.service
        - /home/agent/.local/share/codex-gateway
        - /home/agent/.local/state/codex-gateway
        - /home/agent/.config/codex-gateway
    - name: Reload systemd after uninstall
      ansible.builtin.systemd_service:
        daemon_reload: true
      become: true
    - name: Require old listener to disappear
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 48766
        state: stopped
        timeout: 10
      when: not ansible_check_mode
    - name: Verify LiteLLM after uninstall
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ litellm_root }}/scripts/verify.py", --model, "{{ litellm_model }}"]
      changed_when: false
      when: not ansible_check_mode
    - name: Remove completed configuration recovery state
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ litellm_root }}/scripts/cutover.py", finish]
      when: not ansible_check_mode
