all:
  hosts:
    grace:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
      litellm_home: /home/agent
      litellm_user: agent
      litellm_root: /home/agent/.local/share/litellm
      litellm_config: /home/agent/.config/litellm
      litellm_state: /home/agent/.local/state/litellm
      litellm_uv: /home/agent/.local/share/mise/installs/uv/0.12.11/.mise-bins/uv
      litellm_model: chatgpt/gpt-6-astra
      litellm_modal_credential: /etc/credstore.encrypted/codex-gateway-modal
      codex_version: 0.159.2
      codex_mise: /usr/bin/mise
