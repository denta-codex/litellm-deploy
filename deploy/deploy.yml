- name: Deploy the LiteLLM gateway from the per-machine configuration
  hosts: all
  gather_facts: true
  vars:
    source_root: "{{ playbook_dir }}/.."
    # Files the running proxy imports; changing any of them restarts the service.
    runtime_scripts: [start-litellm, launch.py, serve.py, chatgpt_responses.py, claude-cli, claude_context.py,
                      claude_session.py, claude_provider.py, usage_accounting.py, shared_search.py, live_voice.py,
                      compaction_fallback.py, chat_native.py, gemini_native.py, responses_events.py, deployment.py]
  pre_tasks:
    - name: Load and validate the deployment configuration
      ansible.builtin.import_tasks: tasks/target.yml
      tags: [always]
  tasks:
    - name: Load the list of files retired by the configuration-driven layout
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/retired.yml"
        name: retired
    - name: Require an existing Python 3.14 before changing application files
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", python, find, --no-python-downloads, '3.14']
      register: application_python
      changed_when: false
      check_mode: false
    - name: Inspect the staged pinned Codex binary
      ansible.builtin.stat:
        path: "{{ litellm_codex }}"
      register: pinned_codex
    - name: Require side-by-side Codex installation before gateway deployment
      ansible.builtin.assert:
        that: pinned_codex.stat.executable | default(false)
        fail_msg: Run codex-runtime.yml with -e codex_runtime_action=install first. This stages the binary without switching the app server.
    - name: Inspect deployment source
      ansible.builtin.command: git status --porcelain
      args:
        chdir: "{{ source_root }}"
      register: source_status
      changed_when: false
      check_mode: false
    - name: Require committed deployment source
      ansible.builtin.assert:
        that: source_status.stdout == ''
    - name: Inspect pending model refresh
      ansible.builtin.stat:
        path: "{{ litellm_state }}/model-refresh"
      register: pending_refresh
    - name: Require completed model refresh or recovery
      ansible.builtin.assert:
        that: not pending_refresh.stat.exists
        fail_msg: Recover the pending transaction with refresh-models.yml (or local.yml) -e refresh_action=rollback before deploying.
    - name: Inspect pending voice acceptance
      ansible.builtin.stat:
        path: "{{ litellm_state }}/voice-rollout.json"
      register: pending_voice
    - name: Require voice acceptance or recovery before general deployment
      ansible.builtin.assert:
        that: not pending_voice.stat.exists
        fail_msg: Finish or roll back the pending deploy/voice.yml transaction first.
    - name: Inspect existing model refresh utility
      ansible.builtin.stat:
        path: "{{ litellm_root }}/scripts/refresh_models.py"
      register: installed_refresh
    - name: Inspect the published configured-model list
      ansible.builtin.stat:
        path: "{{ litellm_config }}/models.json"
      register: installed_models
    # Temporary first-cutover exception: a machine that has not yet published
    # models.json still runs the per-provider generators, which cannot read the
    # configuration. Its first refresh-models.yml run publishes models.json and
    # this check applies from then on. Remove the models.json condition together
    # with deploy/retired.yml, once every machine has published models.json.
    - name: Verify installed routes and picker still match saved discovery
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ litellm_root }}/scripts/refresh_models.py",
               --config, "{{ deploy_config_path }}", check-snapshot]
      changed_when: false
      check_mode: false
      when: installed_refresh.stat.exists and installed_models.stat.exists
    - name: Inspect configured encrypted provider credentials
      ansible.builtin.stat:
        path: "{{ item.path }}"
        get_checksum: false
        get_mime: false
      become: true
      loop: "{{ litellm_credentials }}"
      loop_control:
        label: "{{ item.name }}"
      register: credential_files
    - name: Require each configured credential to be a private root-owned file
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg | default(false)
          - item.stat.uid | default(-1) == 0
          - item.stat.mode | default('') == '0600'
        fail_msg: "Create {{ item.item.path }} with systemd-creds encrypt (root-owned, mode 0600) before deployment."
      loop: "{{ credential_files.results }}"
      loop_control:
        label: "{{ item.item.name }}"
    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - "{{ litellm_root }}"
        - "{{ litellm_root }}/scripts"
        - "{{ litellm_config }}"
        - "{{ litellm_state }}"
        - "{{ litellm_state }}/chatgpt"
        - "{{ litellm_state }}/claude"
        - "{{ litellm_state }}/gemini"
    - name: Install locked project
      ansible.builtin.copy:
        src: "{{ source_root }}/{{ item }}"
        dest: "{{ litellm_root }}/{{ item }}"
        mode: '0600'
      loop: [pyproject.toml, uv.lock]
      register: project_files
      notify: Restart LiteLLM
    - name: Install non-secret deployment settings for verification and recovery
      ansible.builtin.template:
        src: deployment.json.j2
        dest: "{{ litellm_config }}/deployment.json"
        mode: '0600'
    - name: Install the credential export map read by the launcher
      ansible.builtin.template:
        src: credentials.json.j2
        dest: "{{ litellm_config }}/credentials.json"
        mode: '0600'
      notify: Restart LiteLLM
    - name: Install service launcher and request customization
      ansible.builtin.copy:
        src: "{{ source_root }}/scripts/{{ item }}"
        dest: "{{ litellm_root }}/scripts/{{ item }}"
        mode: '0700'
      loop: "{{ runtime_scripts }}"
      notify: Restart LiteLLM
    - name: Install deployment utilities without restarting inference
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ litellm_root }}/scripts/{{ item | basename }}"
        mode: '0700'
      with_fileglob: "{{ source_root }}/scripts/*"
      when: item | basename not in runtime_scripts
    - name: Remove scripts retired by the configuration-driven layout
      ansible.builtin.file:
        path: "{{ litellm_root }}/scripts/{{ item }}"
        state: absent
      loop: "{{ retired.scripts }}"
    - name: Remove service drop-ins replaced by the configured unit
      ansible.builtin.file:
        path: "/etc/systemd/system/litellm.service.d/{{ item }}"
        state: absent
      loop: "{{ retired.dropins }}"
      become: true
      notify: Restart LiteLLM
    - name: Inspect installed Python environment
      ansible.builtin.stat:
        path: "{{ litellm_root }}/.venv/bin/litellm"
      register: installed_cli
    - name: Synchronize locked environment
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", sync, --locked, --python, "{{ application_python.stdout | trim }}", --project, "{{ litellm_root }}"]
      environment:
        UV_PYTHON_DOWNLOADS: never
      when: project_files.changed or not installed_cli.stat.exists
      notify: Restart LiteLLM
    - name: Initialize or validate the persistent Gemini state sealing key
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}",
               "{{ litellm_root }}/scripts/gemini_native.py", provision-key,
               --key-file, "{{ litellm_state }}/gemini/state.key"]
      register: gemini_state_key
      changed_when: gemini_state_key.stdout == 'created'
      # The key is durable provider state, not a runtime recovery candidate.
      # Upgrades and rollback must preserve it, including after first cutover.
      no_log: true
      when: not ansible_check_mode
    - name: Provision the selected encrypted proxy credential without exposing the key
      ansible.builtin.command:
        argv: ["{{ litellm_root }}/scripts/provision-key", "{{ litellm_home }}", "{{ litellm_user }}", "{{ litellm_credential_mode }}", "{{ litellm_system_credential }}"]
      become: true
      register: credentials
      changed_when: "'created' in credentials.stdout"
      no_log: true
    - name: Bootstrap LiteLLM configuration without overwriting discovered routes
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ litellm_config }}/config.yaml"
        mode: '0600'
        force: false
      notify: Restart LiteLLM
    # The bootstrap above never rewrites an existing configuration. Without this,
    # a JSON request keeps running (and holds shared search's identical-request
    # lock) after its client gives up; streams already cancel on disconnect.
    - name: Cancel upstream work when a non-streaming client disconnects
      # Migrates existing configs; runtime_rollout.with_cancel_on_disconnect journals the same
      # edit. Remove both once every host's config.yaml carries the setting.
      ansible.builtin.lineinfile:
        path: "{{ litellm_config }}/config.yaml"
        regexp: '^  cancel_on_disconnect:'
        insertafter: '^general_settings:'
        line: '  cancel_on_disconnect: true'
      notify: Restart LiteLLM
    - name: Install system service
      ansible.builtin.template:
        src: litellm.service.j2
        dest: /etc/systemd/system/litellm.service
        mode: '0644'
      become: true
      notify: Restart LiteLLM
    - name: Start and enable LiteLLM
      ansible.builtin.systemd_service:
        name: litellm.service
        enabled: true
        state: started
        daemon_reload: true
      become: true
      when: not ansible_check_mode
    - name: Apply service changes
      ansible.builtin.meta: flush_handlers
    - name: Verify local service liveness
      ansible.builtin.uri:
        url: http://127.0.0.1:4000/health/liveliness
      register: health
      until: health.status == 200
      retries: 20
      delay: 2
      when: not ansible_check_mode
    - name: Verify subscription voice registration without creating a call
      ansible.builtin.uri:
        url: http://127.0.0.1:4000/v1/live
        method: GET
        status_code: 405
      when: not ansible_check_mode and litellm_voice_enabled
    # The preflight check runs the previously installed code, so route or picker
    # defaults introduced by this release only become visible here. Refresh is a
    # separate step: it must run after runtime_rollout.py finish (the runtime
    # journal protects the generated files) and validates against the new code.
    - name: Check whether this release changes the generated models
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ source_root }}/scripts/refresh_models.py",
               --config, "{{ deploy_config_path }}", check-snapshot]
      register: release_snapshot
      changed_when: false
      failed_when: false
      check_mode: false
      when: installed_models.stat.exists
    - name: Report that published models need refresh-models.yml
      ansible.builtin.debug:
        msg:
          - "MODEL REFRESH REQUIRED: this release changes the generated routes or picker."
          - "{{ (release_snapshot.stderr | default('', true)).strip().splitlines()[-1:] | join('') }}"
          - "Run runtime_rollout.py finish, then refresh-models.yml. Until then, deploy.yml stops at its snapshot check."
      when: release_snapshot.rc | default(0) != 0
  handlers:
    - name: Restart LiteLLM
      ansible.builtin.systemd_service:
        name: litellm.service
        state: restarted
        daemon_reload: true
      become: true
      when: not ansible_check_mode
