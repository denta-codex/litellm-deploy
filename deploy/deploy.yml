- name: Deploy LiteLLM on Grace
  hosts: grace
  gather_facts: true
  vars:
    source_root: "{{ playbook_dir }}/.."
  tasks:
    - name: Check destination identity
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == 'grace'
          - ansible_facts.user_id == litellm_user
          - litellm_home == '/home/agent'
          - litellm_root == '/home/agent/.local/share/litellm'
    - name: Inspect deployment source
      ansible.builtin.command: git status --porcelain
      args:
        chdir: "{{ source_root }}"
      register: source_status
      changed_when: false
      check_mode: false
    - name: Require committed deployment source
      ansible.builtin.assert:
        that: source_status.stdout == ''
    - name: Inspect pending model refresh
      ansible.builtin.stat:
        path: "{{ litellm_state }}/model-refresh"
      register: pending_refresh
    - name: Require completed model refresh or recovery
      ansible.builtin.assert:
        that: not pending_refresh.stat.exists
        fail_msg: Recover the pending transaction with its original playbook (modal.yml or refresh-models.yml) -e refresh_action=rollback before deploying.
    - name: Inspect retained encrypted Modal inference credential
      ansible.builtin.stat:
        path: "{{ litellm_modal_credential }}"
        get_checksum: false
        get_mime: false
      become: true
      register: modal_credential
    - name: Require the existing private Modal credential
      ansible.builtin.assert:
        that:
          - modal_credential.stat.exists
          - modal_credential.stat.isreg | default(false)
          - modal_credential.stat.uid | default(-1) == 0
          - modal_credential.stat.mode | default('') == '0600'
        fail_msg: Restore the retained root-owned encrypted Modal credential before deployment.
    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - "{{ litellm_root }}"
        - "{{ litellm_root }}/scripts"
        - "{{ litellm_config }}"
        - "{{ litellm_state }}"
        - "{{ litellm_state }}/chatgpt"
    - name: Install locked project
      ansible.builtin.copy:
        src: "{{ source_root }}/{{ item }}"
        dest: "{{ litellm_root }}/{{ item }}"
        mode: '0600'
      loop: [pyproject.toml, uv.lock]
      register: project_files
      notify: Restart LiteLLM
    - name: Install service launcher and request customization
      ansible.builtin.copy:
        src: "{{ source_root }}/scripts/{{ item }}"
        dest: "{{ litellm_root }}/scripts/{{ item }}"
        mode: '0700'
      loop: [start-litellm, launch.py, serve.py, chatgpt_responses.py]
      notify: Restart LiteLLM
    - name: Install deployment utilities without restarting inference
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ litellm_root }}/scripts/{{ item | basename }}"
        mode: '0700'
      with_fileglob: "{{ source_root }}/scripts/*"
      when: item | basename not in ['start-litellm', 'launch.py', 'serve.py', 'chatgpt_responses.py']
    - name: Inspect installed Python environment
      ansible.builtin.stat:
        path: "{{ litellm_root }}/.venv/bin/litellm"
      register: installed_cli
    - name: Synchronize locked environment
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", sync, --locked, --project, "{{ litellm_root }}"]
      environment:
        UV_PYTHON_DOWNLOADS: never
      when: project_files.changed or not installed_cli.stat.exists
      notify: Restart LiteLLM
    - name: Create encrypted credential pair without exposing the key
      ansible.builtin.command:
        argv: ["{{ litellm_root }}/scripts/provision-key"]
      become: true
      register: credentials
      changed_when: "'created' in credentials.stdout"
      no_log: true
    - name: Verify saved discovery is still installed
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ source_root }}/scripts/{{ item }}", check-snapshot]
      loop: [refresh_models.py, configure_modal.py]
      changed_when: false
      check_mode: false
      when: installed_cli.stat.exists or not ansible_check_mode
    - name: Bootstrap LiteLLM configuration without overwriting discovered routes
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ litellm_config }}/config.yaml"
        mode: '0600'
        force: false
      notify: Restart LiteLLM
    - name: Install system service
      ansible.builtin.template:
        src: litellm.service.j2
        dest: /etc/systemd/system/litellm.service
        mode: '0644'
      become: true
      notify: Restart LiteLLM
    - name: Start and enable LiteLLM
      ansible.builtin.systemd_service:
        name: litellm.service
        enabled: true
        state: started
        daemon_reload: true
      become: true
      when: not ansible_check_mode
    - name: Apply service changes
      ansible.builtin.meta: flush_handlers
    - name: Verify local service liveness
      ansible.builtin.uri:
        url: http://127.0.0.1:4000/health/liveliness
      register: health
      until: health.status == 200
      retries: 20
      delay: 2
      when: not ansible_check_mode
  handlers:
    - name: Restart LiteLLM
      ansible.builtin.systemd_service:
        name: litellm.service
        state: restarted
        daemon_reload: true
      become: true
      when: not ansible_check_mode
