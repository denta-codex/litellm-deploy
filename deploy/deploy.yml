- name: Deploy LiteLLM on Grace
  hosts: grace
  gather_facts: true
  vars:
    source_root: "{{ playbook_dir }}/.."
  tasks:
    - name: Check destination identity
      tags: [compaction-recovery]
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == 'grace'
          - ansible_facts.user_id == litellm_user
          - litellm_home == '/home/agent'
          - litellm_root == '/home/agent/.local/share/litellm'
    - name: Inspect deployment source
      tags: [compaction-recovery]
      ansible.builtin.command: git status --porcelain
      args:
        chdir: "{{ source_root }}"
      register: source_status
      changed_when: false
      check_mode: false
    - name: Require committed deployment source
      tags: [compaction-recovery]
      ansible.builtin.assert:
        that: source_status.stdout == ''
    - name: Inspect pending model refresh
      tags: [compaction-recovery]
      ansible.builtin.stat:
        path: "{{ litellm_state }}/model-refresh"
      register: pending_refresh
    - name: Inspect pending voice acceptance
      ansible.builtin.stat:
        path: "{{ litellm_state }}/voice-rollout.json"
      register: pending_voice
    - name: Require voice acceptance or recovery before general deployment
      ansible.builtin.assert:
        that: not pending_voice.stat.exists
        fail_msg: Finish or roll back the pending deploy/voice.yml transaction first.
    - name: Require completed model refresh or recovery
      tags: [compaction-recovery]
      ansible.builtin.assert:
        that: not pending_refresh.stat.exists
        fail_msg: Recover the pending transaction with its original playbook (claude.yml, modal.yml, local.yml, bedrock.yml or refresh-models.yml) -e refresh_action=rollback before deploying.
    - name: Inspect existing model refresh utility
      ansible.builtin.stat:
        path: "{{ litellm_root }}/scripts/refresh_models.py"
      register: installed_refresh
    - name: Verify saved discovery with the currently installed generators
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ litellm_root }}/scripts/{{ item }}", check-snapshot]
      loop: [refresh_models.py, configure_modal.py, configure_claude.py]
      changed_when: false
      check_mode: false
      when: installed_refresh.stat.exists
    - name: Inspect saved local model snapshot
      ansible.builtin.stat:
        path: "{{ litellm_state }}/local-model.json"
      register: local_snapshot
    - name: Verify saved local route with installed generator
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ litellm_root }}/scripts/configure_local.py", check-snapshot]
      changed_when: false
      check_mode: false
      when: local_snapshot.stat.exists
    - name: Inspect saved Bedrock snapshot
      ansible.builtin.stat:
        path: "{{ litellm_state }}/bedrock-models.json"
      register: bedrock_snapshot
    - name: Verify saved Bedrock routes with installed generator
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ litellm_root }}/scripts/configure_bedrock.py", check-snapshot]
      changed_when: false
      check_mode: false
      when: bedrock_snapshot.stat.exists
    - name: Require enabled Bedrock credentials for retained routes
      ansible.builtin.assert:
        that: litellm_bedrock_enabled | default(false)
      when: bedrock_snapshot.stat.exists
    - name: Inspect encrypted Bedrock runtime credential
      ansible.builtin.stat:
        path: "{{ litellm_bedrock_credential }}"
        get_checksum: false
        get_mime: false
      become: true
      register: bedrock_credential
      when: litellm_bedrock_enabled | default(false)
    - name: Require the existing private Bedrock credential
      ansible.builtin.assert:
        that:
          - bedrock_credential.stat.exists
          - bedrock_credential.stat.isreg | default(false)
          - bedrock_credential.stat.uid | default(-1) == 0
          - bedrock_credential.stat.mode | default('') == '0600'
      when: litellm_bedrock_enabled | default(false)
    - name: Inspect retained encrypted Modal inference credential
      ansible.builtin.stat:
        path: "{{ litellm_modal_credential }}"
        get_checksum: false
        get_mime: false
      become: true
      register: modal_credential
    - name: Require the existing private Modal credential
      ansible.builtin.assert:
        that:
          - modal_credential.stat.exists
          - modal_credential.stat.isreg | default(false)
          - modal_credential.stat.uid | default(-1) == 0
          - modal_credential.stat.mode | default('') == '0600'
        fail_msg: Restore the retained root-owned encrypted Modal credential before deployment.
    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - "{{ litellm_root }}"
        - "{{ litellm_root }}/scripts"
        - "{{ litellm_config }}"
        - "{{ litellm_state }}"
        - "{{ litellm_state }}/chatgpt"
        - "{{ litellm_state }}/claude"
    - name: Install locked project
      ansible.builtin.copy:
        src: "{{ source_root }}/{{ item }}"
        dest: "{{ litellm_root }}/{{ item }}"
        mode: '0600'
      loop: [pyproject.toml, uv.lock]
      register: project_files
      notify: Restart LiteLLM
    - name: Install service launcher and request customization
      ansible.builtin.copy:
        src: "{{ source_root }}/scripts/{{ item }}"
        dest: "{{ litellm_root }}/scripts/{{ item }}"
        mode: '0700'
      loop: [start-litellm, launch.py, serve.py, chatgpt_responses.py, claude-cli, claude_session.py, claude_provider.py, shared_search.py, live_voice.py, bedrock_aws.py]
      notify: Restart LiteLLM
    - name: Install compaction recovery runtime
      tags: [compaction-recovery]
      ansible.builtin.copy:
        src: "{{ source_root }}/scripts/{{ item }}"
        dest: "{{ litellm_root }}/scripts/{{ item }}"
        mode: '0700'
      loop: [claude_context.py, compaction_fallback.py]
      notify: Restart LiteLLM
    - name: Inspect launcher for targeted compaction deployment
      tags: [compaction-recovery]
      ansible.builtin.slurp:
        src: "{{ litellm_root }}/scripts/serve.py"
      register: compaction_launcher
      when: "'compaction-recovery' in ansible_run_tags"
    - name: Require the shared-search dispatch installation point
      tags: [compaction-recovery]
      ansible.builtin.assert:
        that: "'    install_search()' in (compaction_launcher.content | b64decode).splitlines()"
        fail_msg: Review the installed launcher before applying targeted compaction recovery.
      when: "'compaction-recovery' in ansible_run_tags"
    - name: Add compaction dispatch to the installed launcher
      tags: [compaction-recovery]
      ansible.builtin.blockinfile:
        path: "{{ litellm_root }}/scripts/serve.py"
        insertafter: '^    install_search\(\)$'
        marker: '    # {mark} managed compaction recovery'
        block: |2
              from compaction_fallback import install as install_compaction
              install_compaction()
      when:
        - "'compaction-recovery' in ansible_run_tags"
        - "'    install_compaction()' not in (compaction_launcher.content | b64decode).splitlines()"
      notify: Restart LiteLLM
    - name: Install compaction verification utility
      tags: [compaction-recovery]
      ansible.builtin.copy:
        src: "{{ source_root }}/scripts/verify_compaction.py"
        dest: "{{ litellm_root }}/scripts/verify_compaction.py"
        mode: '0700'
    - name: Create compaction service drop-in directory
      tags: [compaction-recovery]
      ansible.builtin.file:
        path: /etc/systemd/system/litellm.service.d
        state: directory
        mode: '0755'
      become: true
    - name: Configure compaction recovery
      tags: [compaction-recovery]
      ansible.builtin.template:
        src: compaction-recovery.conf.j2
        dest: /etc/systemd/system/litellm.service.d/30-compaction-recovery.conf
        mode: '0644'
      become: true
      notify: Restart LiteLLM
    - name: Configure Bedrock systemd credential
      ansible.builtin.template:
        src: bedrock.conf.j2
        dest: /etc/systemd/system/litellm.service.d/40-bedrock.conf
        mode: '0644'
      become: true
      notify: Restart LiteLLM
    - name: Install deployment utilities without restarting inference
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ litellm_root }}/scripts/{{ item | basename }}"
        mode: '0700'
      with_fileglob: "{{ source_root }}/scripts/*"
      when: item | basename not in ['start-litellm', 'launch.py', 'serve.py', 'chatgpt_responses.py', 'claude-cli', 'claude_context.py', 'claude_session.py', 'claude_provider.py', 'shared_search.py', 'live_voice.py', 'bedrock_aws.py', 'compaction_fallback.py']
    - name: Inspect installed Python environment
      ansible.builtin.stat:
        path: "{{ litellm_root }}/.venv/bin/litellm"
      register: installed_cli
    - name: Synchronize locked environment
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", sync, --locked, --project, "{{ litellm_root }}"]
      environment:
        UV_PYTHON_DOWNLOADS: never
      when: project_files.changed or not installed_cli.stat.exists
      notify: Restart LiteLLM
    - name: Create encrypted credential pair without exposing the key
      ansible.builtin.command:
        argv: ["{{ litellm_root }}/scripts/provision-key"]
      become: true
      register: credentials
      changed_when: "'created' in credentials.stdout"
      no_log: true
    - name: Bootstrap LiteLLM configuration without overwriting discovered routes
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ litellm_config }}/config.yaml"
        mode: '0600'
        force: false
      notify: Restart LiteLLM
    - name: Install system service
      ansible.builtin.template:
        src: litellm.service.j2
        dest: /etc/systemd/system/litellm.service
        mode: '0644'
      become: true
      notify: Restart LiteLLM
    - name: Start and enable LiteLLM
      ansible.builtin.systemd_service:
        name: litellm.service
        enabled: true
        state: started
        daemon_reload: true
      become: true
      when: not ansible_check_mode
    - name: Apply service changes
      tags: [compaction-recovery]
      ansible.builtin.meta: flush_handlers
    - name: Verify local service liveness
      tags: [compaction-recovery]
      ansible.builtin.uri:
        url: http://127.0.0.1:4000/health/liveliness
      register: health
      until: health.status == 200
      retries: 20
      delay: 2
      when: not ansible_check_mode
    - name: Verify subscription voice registration without creating a call
      ansible.builtin.uri:
        url: http://127.0.0.1:4000/v1/live
        method: GET
        status_code: 405
      when: not ansible_check_mode
  handlers:
    - name: Restart LiteLLM
      ansible.builtin.systemd_service:
        name: litellm.service
        state: restarted
        daemon_reload: true
      become: true
      when: not ansible_check_mode
