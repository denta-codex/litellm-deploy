- name: Install and validate Grace local inference
  hosts: all
  gather_facts: true
  vars:
    source_root: "{{ playbook_dir }}/.."
    local_root: "{{ litellm_home }}/.local/share/llama-local"
    local_model: "{{ lookup('file', source_root + '/scripts/local-model.json') | from_json }}"
  pre_tasks:
    - name: Validate the selected local host
      ansible.builtin.import_tasks: tasks/target.yml
      tags: [always]
      vars:
        supported_hosts: [grace]
  tasks:
    - name: Check destination
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == 'grace'
          - ansible_facts.user_id == litellm_user
          - litellm_home == '/home/agent'
    - name: Inspect source status
      ansible.builtin.command: git status --porcelain
      args:
        chdir: "{{ source_root }}"
      register: source_status
      changed_when: false
      check_mode: false
    - name: Require committed deployment source
      ansible.builtin.assert:
        that: source_status.stdout == ''
    - name: Inspect pending activation
      ansible.builtin.stat:
        path: "{{ litellm_state }}/model-refresh"
      register: pending
    - name: Require completed activation or recovery
      ansible.builtin.assert:
        that: not pending.stat.exists
    - name: Inspect service installation
      ansible.builtin.stat:
        path: /etc/systemd/system/llama-local.service
      register: local_service
    - name: Check initial port availability
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ local_model.port }}"
        state: stopped
        timeout: 1
      when: not local_service.stat.exists
      check_mode: false
    - name: Create private application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - "{{ local_root }}"
        - "{{ local_root }}/staging"
        - "{{ local_root }}/cache"
        - "{{ local_root }}/runtime/{{ local_model.runtime.version }}"
        - "{{ local_root }}/models/{{ local_model.revision }}"
        - "{{ litellm_config }}"
    - name: Inspect verified runtime release
      ansible.builtin.stat:
        path: "{{ local_root }}/runtime/{{ local_model.runtime.version }}/verified.json"
      register: runtime_installed
    - name: Download checksum-verified runtime archives
      ansible.builtin.get_url:
        url: "https://github.com/ggml-org/llama.cpp/releases/download/{{ local_model.runtime.version }}/{{ item.name }}"
        dest: "{{ local_root }}/staging/{{ item.name }}"
        checksum: "sha256:{{ item.sha256 }}"
        mode: '0600'
        timeout: 120
      loop: "{{ local_model.runtime.artifacts }}"
      when: not ansible_check_mode and not runtime_installed.stat.exists
    - name: Extract pinned runtime and its CUDA libraries
      ansible.builtin.unarchive:
        src: "{{ local_root }}/staging/{{ item.name }}"
        dest: "{{ local_root }}/runtime/{{ local_model.runtime.version }}"
        remote_src: true
      loop: "{{ local_model.runtime.artifacts }}"
      when: not ansible_check_mode and not runtime_installed.stat.exists
    - name: Verify runtime executable before marking the release installed
      ansible.builtin.command:
        argv: ["{{ local_root }}/runtime/{{ local_model.runtime.version }}/llama-{{ local_model.runtime.version }}/llama-server", --version]
      environment:
        LD_LIBRARY_PATH: "{{ local_root }}/runtime/{{ local_model.runtime.version }}/cudart-llama-{{ local_model.runtime.version }}-bin-ubuntu-cuda-{{ local_model.runtime.cuda }}-x64"
      changed_when: false
      when: not ansible_check_mode and not runtime_installed.stat.exists
    - name: Mark fully extracted checksum-verified runtime
      ansible.builtin.copy:
        content: "{{ local_model.runtime | to_nice_json }}\n"
        dest: "{{ local_root }}/runtime/{{ local_model.runtime.version }}/verified.json"
        mode: '0600'
      when: not ansible_check_mode and not runtime_installed.stat.exists
    - name: Download checksum-verified model
      ansible.builtin.get_url:
        url: "https://huggingface.co/{{ local_model.repository }}/resolve/{{ local_model.revision }}/{{ item.name }}"
        dest: "{{ local_root }}/models/{{ local_model.revision }}/{{ item.name }}"
        checksum: "sha256:{{ item.sha256 }}"
        mode: '0600'
        timeout: 120
      loop: "{{ local_model.artifacts }}"
      when: not ansible_check_mode
    - name: Require the embedded chat template the override was derived from
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ source_root }}/scripts/gguf_template.py",
               "{{ local_root }}/models/{{ local_model.revision }}/{{ local_model.artifacts[0].name }}",
               --check, "{{ local_model.chat_template.upstream_sha256 }}"]
      changed_when: false
      when: not ansible_check_mode
    - name: Inspect committed chat template override
      ansible.builtin.stat:
        path: "{{ source_root }}/deploy/files/{{ local_model.chat_template.name }}"
        checksum_algorithm: sha256
      register: chat_template_source
    - name: Require the override recorded in the manifest
      ansible.builtin.assert:
        that: chat_template_source.stat.checksum == local_model.chat_template.sha256
        fail_msg: Chat template override does not match scripts/local-model.json sha256.
    - name: Install chat template override
      ansible.builtin.copy:
        src: "{{ source_root }}/deploy/files/{{ local_model.chat_template.name }}"
        dest: "{{ litellm_config }}/{{ local_model.chat_template.name }}"
        mode: '0600'
      register: chat_template
    - name: Install model preset
      ansible.builtin.template:
        src: llama-models.ini.j2
        dest: "{{ litellm_config }}/llama-models.ini"
        mode: '0600'
      register: preset
    - name: Install inference unit
      ansible.builtin.template:
        src: llama-local.service.j2
        dest: /etc/systemd/system/llama-local.service
        mode: '0644'
      become: true
      register: unit
    - name: Start and validate backend
      when: not ansible_check_mode
      block:
        - name: Start backend without loading weights at boot
          ansible.builtin.systemd_service:
            name: llama-local.service
            enabled: true
            state: "{{ 'restarted' if (preset.changed or unit.changed or chat_template.changed) else 'started' }}"
            daemon_reload: true
          become: true
        - name: Wait for router liveness
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ local_model.port }}/health"
          register: health
          until: health.status == 200
          retries: 20
          delay: 2
        - name: Validate text and tools before routing traffic
          ansible.builtin.command:
            argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ source_root }}/scripts/verify_local.py", --backend]
          changed_when: false
      rescue:
        - name: Stop rejected backend
          ansible.builtin.systemd_service:
            name: llama-local.service
            state: stopped
            enabled: false
          become: true
        - name: Report backend validation failure
          ansible.builtin.fail:
            msg: Local backend validation failed. Service stopped; LiteLLM routes and picker were not changed.
    - name: Remove successfully installed archive staging
      ansible.builtin.file:
        path: "{{ local_root }}/staging"
        state: absent
      when: not ansible_check_mode
