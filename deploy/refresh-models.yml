- name: Refresh the subscription catalog and publish the configured models
  hosts: all
  gather_facts: true
  vars:
    source_root: "{{ playbook_dir }}/.."
    refresh_action: refresh
    refresh_command: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ source_root }}/scripts/refresh_models.py",
                      --config, "{{ deploy_config_path }}"]
  pre_tasks:
    - name: Load and validate the deployment configuration
      ansible.builtin.import_tasks: tasks/target.yml
      tags: [always]
  tasks:
    - name: Run shared refresh-models tasks
      ansible.builtin.import_tasks: tasks/refresh-models.yml
