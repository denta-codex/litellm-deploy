# Per-machine deployment configuration.
#
# The repository is identical on every machine; everything that differs lives in
# this one file, installed outside the repository at
# ~/.config/litellm-deploy/config.yml (override with -e config=PATH for Ansible or
# --config PATH for the scripts). Copy this example and edit it. Unknown keys are
# rejected. Values below are placeholders.

# Account that runs the gateway and Codex app server, and its home directory.
user: example
home: /home/example
# The mise binary that provides uv and Codex for this account.
mise: /usr/bin/mise
codex_version: 0.166.0
# Model selected for new Codex sessions.
default_model: chatgpt/gpt-6-astra
# Where clients read the gateway key: "user" (systemd user credential in
# ~/.config/litellm/proxy-key.cred) or "system" (decrypted with sudo from
# /etc/credstore.encrypted/litellm-proxy-key).
credential_mode: user

# Optional switches (defaults shown in comments).
forward_agent: false        # forward the SSH agent into the Codex app server
compaction_fallback: true   # retry failed remote compaction locally
voice: false                # subscription realtime voice endpoint
local_inference: false      # llama.cpp runtime (deploy/local.yml)
browser: false              # or {node: /absolute/path/to/node} for Codex browser tools

# Encrypted systemd credentials loaded into the LiteLLM service. Each export
# says how launch.py turns the credential into environment variables:
#   {env: VAR}                    whole file, one token
#   {path_env: [VAR, ...]}        file path, for SDKs that read files
#   {json: {field: VAR, ...}}     string fields of a JSON document
#   {modal_token: VAR}            Modal combined wk/ws inference token
# The gateway key (litellm-proxy-key) is always loaded and need not be listed.
credentials:
  - name: modal-inference-token
    path: /etc/credstore.encrypted/modal-inference-token
    export: {modal_token: MODAL_API_KEY}
  - name: bedrock-aws-credentials
    path: /etc/credstore.encrypted/bedrock-aws-credentials
    export:
      json: {access_key_id: AWS_ACCESS_KEY_ID, secret_access_key: AWS_SECRET_ACCESS_KEY, region: AWS_REGION_NAME}
  - name: vertex-ai-credentials
    path: /etc/credstore.encrypted/vertex-ai-credentials
    export: {path_env: [VERTEX_CREDENTIALS_PATH, GOOGLE_APPLICATION_CREDENTIALS]}

# Models beside the ChatGPT subscription catalog, refreshed by
# deploy/refresh-models.yml. Each entry is:
#   name:       route and Codex slug, provider/model (not chatgpt/...)
#   litellm:    LiteLLM litellm_params, exactly as LiteLLM documents them
#   model_info: optional LiteLLM model_info; catalog_pricing selects the
#               models.dev price row shown in Codex
#   codex:      Codex catalog fields; display_name, context_window,
#               supported_reasoning_levels and default_reasoning_level are required
#   verify:     optional {args, validators, timeout}; validators are scripts/
#               commands with {model} and {catalog} placeholders
models:
  - name: modal/example-endpoint
    litellm:
      model: openai/example-endpoint
      api_base: https://inference.example.modal.direct/v1
      api_key: os.environ/MODAL_API_KEY
      use_chat_completions_api: true
    model_info:
      catalog_pricing: {provider: example-provider, model: example-model}
    codex:
      display_name: Modal Example
      context_window: 1048576
      input_modalities: [text, image]
      supported_reasoning_levels: [low, high, max]
      default_reasoning_level: high
      priority: 90

  - name: bedrock/example-model
    litellm:
      model: bedrock/example.model-v1
      aws_region_name: us-east-1
    codex:
      display_name: Bedrock Example
      context_window: 200000
      input_modalities: [text, image]
      supported_reasoning_levels: [low, medium, high]
      default_reasoning_level: high
    verify:
      args: [--auto-tool-choice]
      validators:
        - [verify_capabilities.py, --model, '{model}', --catalog, '{catalog}']
        - [verify_shared_search.py, --model, '{model}', --catalog, '{catalog}']
        - [verify_codex_image.py, --model, '{model}', --catalog, '{catalog}']

  - name: vertex/gemini-4-carbon
    litellm:
      model: vertex_ai/gemini-4-carbon
      vertex_project: example-project
      vertex_location: global
      use_chat_completions_api: true
      reasoning_effort: medium
    codex:
      display_name: Gemini Carbon
      base_instructions_file: gemini-instructions.md
      context_window: 1048576
      input_modalities: [text, image]
      supported_reasoning_levels: [low, medium, high]
      default_reasoning_level: medium
    verify:
      validators:
        - [verify_capabilities.py, --model, '{model}', --catalog, '{catalog}']
        - [verify_shared_search.py, --model, '{model}', --catalog, '{catalog}']

  - name: claude/example-model
    litellm:
      model: claudesdk/example-model
      use_chat_completions_api: true
      allowed_openai_params: [reasoning_effort, response_format, parallel_tool_calls]
      num_retries: 0
    codex:
      display_name: Claude Example
      base_instructions_file: claude-instructions.md
      context_window: 200000
      input_modalities: [text, image]
      supported_reasoning_levels: [low, medium, high]
      default_reasoning_level: high
      supports_search_tool: false
      tool_mode: direct
    verify:
      timeout: 1800
      validators:
        - [verify_claude.py, --model, '{model}', --catalog, '{catalog}']
        - [verify_shared_search.py, --model, '{model}', --catalog, '{catalog}']

  - name: local/example-model
    litellm:
      model: openai/example-model
      api_base: http://127.0.0.1:18743/v1
      api_key: local-loopback
      use_chat_completions_api: true
      timeout: 300
      stream_timeout: 300
      max_retries: 0
      num_retries: 0
    codex:
      display_name: Local Example
      context_window: 16384
      supported_reasoning_levels: [{effort: none, description: Direct answers}]
      default_reasoning_level: none
      supports_parallel_tool_calls: false
      truncation_policy: {mode: tokens, limit: 2000}
    verify:
      validators:
        - [verify_local.py, --proxy]
