- name: Prepare or recover the Codex provider switch
  hosts: all
  gather_facts: true
  vars:
    cutover_action: prepare
  pre_tasks:
    - name: Validate the selected local host
      ansible.builtin.import_tasks: tasks/target.yml
      tags: [always]
  tasks:
    - name: Check target and operation
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == inventory_hostname
          - ansible_facts.user_id == 'agent'
          - cutover_action in ['prepare', 'rollback', 'check-restart', 'finish']
          - cutover_action != 'finish' or codex_connection_mode == 'ssh' or (litellm_desktop_validated | default(false) | bool)
    - name: Check the live SSH server before accepting the provider change
      ansible.builtin.command:
        argv: ["{{ litellm_root }}/.venv/bin/python", "{{ litellm_root }}/scripts/verify_codex_runtime.py",
               --version, "{{ codex_version }}", --home, "{{ litellm_home }}"]
      become: true
      changed_when: false
      when: cutover_action == 'finish' and codex_connection_mode == 'ssh' and not ansible_check_mode
    - name: Check both SSH proxy clients before accepting the provider change
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-project, "{{ litellm_root }}/scripts/verify_codex_connection.py",
               live, --codex-binary, "{{ litellm_codex }}", --home, "{{ litellm_home }}"]
      changed_when: false
      when: cutover_action == 'finish' and codex_connection_mode == 'ssh' and not ansible_check_mode
    - name: Validate subscription before switching
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ litellm_root }}/scripts/verify.py", --model, "{{ litellm_model }}"]
      changed_when: false
      when: cutover_action == 'prepare' and not ansible_check_mode
    - name: Validate real Codex search and tool continuation before switching
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ litellm_root }}/scripts/verify_codex.py", --model, "{{ litellm_model }}"]
      changed_when: false
      when: cutover_action == 'prepare' and not ansible_check_mode
    - name: Change only the managed Codex provider configuration
      ansible.builtin.command:
        argv: ["{{ litellm_uv }}", run, --no-sync, --project, "{{ litellm_root }}", "{{ litellm_root }}/scripts/cutover.py", "{{ cutover_action }}", --home, "{{ litellm_home }}", --model, "{{ litellm_model }}"]
      changed_when: cutover_action != 'check-restart'
      when: not ansible_check_mode
    - name: Explain check mode limitation
      ansible.builtin.debug:
        msg: Cutover check mode does not authenticate, make inference requests, or edit Codex config. Review the script and its migration tests; live prepare retains one private config recovery record until finish or rollback.
      when: ansible_check_mode
